dismiss:
  name: Dismiss
  description: >-
    Remove a notification or live activity from notify.dashboard (by id).
    Doesn't work on persistent-marked notifications.
  fields:
    id:
      required: true
      example: "3f2e1a90-1234-4a56-8abc-9876543210ab"
      selector:
        text:

dismiss_all:
  name: Dismiss all
  description: Remove all notifications (except persistent-marked ones).

fire_action:
  name: Fire action
  description: >-
    Fires a mobile_app_notification_action event (same shape as the
    companion app). Used internally by the card on an action tap: a
    separate, admin-independent endpoint instead of the fire_event
    websocket command, which only admin users are allowed to call.
  fields:
    action:
      required: true
      example: "SNOOZE"
      selector:
        text:
    tag:
      required: false
      selector:
        text:
    action_data:
      required: false
      selector:
        object:
