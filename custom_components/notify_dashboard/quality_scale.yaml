rules:
  # Bronze
  config-flow: done
  unique-config-entry: done
  entity-unique-id: done
  entity-event-setup: done
  action-setup:
    status: done
    comment: >
      Services are registered in _async_ensure_core, called from async_setup.
      HA's bootstrap always calls async_setup for a domain first (even with
      an empty config) before setting up config entries for that same
      domain, so in practice this always happens via async_setup — even
      when only a config entry is present and no YAML.
  runtime-data:
    status: exempt
    comment: >
      Can't be done fully: the legacy notify platform (notify.py) doesn't
      receive a ConfigEntry object from HA (BaseNotificationService.
      async_get_service only gets hass/config), so that code structurally
      can't reach entry.runtime_data. hass.data[DOMAIN] therefore stays the
      canonical storage location; this is an architectural limitation of the
      legacy notify platform itself, not a choice we can resolve here without
      giving up the YAML-only notify.dashboard service.
  has-entity-name: done
  common-modules: done
  dependency-transparency: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-actions: done
  docs-triggers:
    status: exempt
    comment: This integration doesn't provide any triggers.
  docs-conditions:
    status: exempt
    comment: This integration doesn't provide any conditions.
  brands:
    status: todo
    comment: >
      No brand assets submitted to home-assistant/brands yet. The folder
      structure is already staged in brand/ (see brand/README.md) — only the
      actual icon/logo files and the PR to that repo are still missing.
  config-flow-test-coverage:
    status: todo
    comment: No automated tests present — a deliberate choice for this personal repo, not intended for core inclusion.
  test-before-setup:
    status: exempt
    comment: No external device/connection to validate; the integration has no failable "connection".
  appropriate-polling:
    status: exempt
    comment: Push-based via notify calls and a dispatcher signal, no polling.

  # Silver
  action-exceptions:
    status: done
    comment: >
      dismiss raises ServiceValidationError for an unknown id
      (NotificationNotFoundError) and for a persistent-marked notification
      (NotificationNotDismissableError) — instead of silently failing.
  config-entry-unloading: done
  integration-owner: done
  docs-configuration-parameters: done
  docs-installation-parameters:
    status: exempt
    comment: Installation requires no parameters (no host/token/device selection).
  parallel-updates:
    status: exempt
    comment: No coordinator/polling entities.
  entity-unavailable:
    status: exempt
    comment: No external connection that can drop.
  log-when-unavailable:
    status: exempt
    comment: Same reason as entity-unavailable.
  reauthentication-flow:
    status: exempt
    comment: No authentication needed.
  test-coverage:
    status: todo
    comment: Same reason as config-flow-test-coverage.
