rules:
  # Bronze
  config-flow: done
  unique-config-entry: done
  entity-unique-id: done
  entity-event-setup: done
  action-setup:
    status: done
    comment: >
      Services worden geregistreerd in _async_ensure_core, aangeroepen vanuit
      async_setup. HA's bootstrap roept voor een domain altijd eerst
      async_setup aan (ook met lege config) vóórdat config entries voor
      datzelfde domain worden opgezet, dus dit gebeurt in de praktijk altijd
      via async_setup — ook wanneer alleen een config entry aanwezig is en
      geen YAML.
  runtime-data:
    status: exempt
    comment: >
      Kan niet volledig: het legacy notify-platform (notify.py) ontvangt
      geen ConfigEntry-object van HA (BaseNotificationService.async_get_service
      krijgt alleen hass/config), dus die code kan entry.runtime_data
      structureel niet bereiken. hass.data[DOMAIN] blijft daarom de
      canonieke opslagplek; dit is een architecturale beperking van het
      legacy notify-platform zelf, niet een keuze die we hier kunnen
      oplossen zonder de YAML-only notify.dashboard-service op te geven.
  has-entity-name: done
  common-modules: done
  dependency-transparency: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-actions: done
  docs-triggers:
    status: exempt
    comment: Geen triggers geleverd door deze integratie.
  docs-conditions:
    status: exempt
    comment: Geen condities geleverd door deze integratie.
  brands:
    status: todo
    comment: >
      Nog geen brand-assets aangeleverd bij home-assistant/brands. Mapstructuur
      staat al klaar in brand/ (zie brand/README.md) — alleen de daadwerkelijke
      icon/logo-bestanden en de PR daarnaartoe ontbreken nog.
  config-flow-test-coverage:
    status: todo
    comment: Geen geautomatiseerde tests aanwezig — bewuste keuze voor deze persoonlijke repo, geen kern-inclusie beoogd.
  test-before-setup:
    status: exempt
    comment: Geen extern apparaat/verbinding om te valideren; de integratie heeft geen faalbare "connectie".
  appropriate-polling:
    status: exempt
    comment: Push-based via notify-aanroepen en een dispatcher-signal, geen polling.

  # Silver
  action-exceptions:
    status: done
    comment: >
      dismiss raist ServiceValidationError bij een onbekend id
      (NotificationNotFoundError) en bij een persistent-gemarkeerde
      notification (NotificationNotDismissableError) — i.p.v. stil te falen.
  config-entry-unloading: done
  integration-owner: done
  docs-configuration-parameters: done
  docs-installation-parameters:
    status: exempt
    comment: Installatie vereist geen parameters (geen host/token/device-keuze).
  parallel-updates:
    status: exempt
    comment: Geen coordinator/polling-entities.
  entity-unavailable:
    status: exempt
    comment: Geen externe verbinding die kan wegvallen.
  log-when-unavailable:
    status: exempt
    comment: Zelfde reden als entity-unavailable.
  reauthentication-flow:
    status: exempt
    comment: Geen authenticatie nodig.
  test-coverage:
    status: todo
    comment: Zelfde reden als config-flow-test-coverage.
